<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptHub v2</title>
  <link rel="stylesheet" href="app.css?v=6b6c2a9" />
</head>
<body>
  <div id="layout">

    <!-- 左サイドバー: カテゴリ一覧 -->
    <aside id="sidebar">
      <div id="logo">PromptHub</div>
      <nav id="cat-nav"><!-- JS で生成 --></nav>
    </aside>

    <!-- メインエリア -->
    <main id="main">

      <!-- フィルタバー -->
      <div id="filterbar">
        <input id="search" type="search" placeholder="全カテゴリを検索 (en / jp)..." autocomplete="off" />
        <div id="target-filters">
          <button class="tf-btn active" data-target="">すべて</button>
          <button class="tf-btn" data-target="self">self</button>
          <button class="tf-btn" data-target="other">other</button>
          <button class="tf-btn" data-target="mutual">mutual</button>
          <button class="tf-btn" data-target="object">object</button>
          <button class="tf-btn" data-target="__null__">未設定</button>
        </div>
        <button id="tag-add-btn" title="タグを追加">＋ タグ追加</button>
      </div>

      <!-- Prompt Builder バー -->
      <div id="builder-bar">
        <span id="builder-label">Prompt Builder</span>
        <div id="builder-chips"><!-- JS で生成 --></div>
        <div id="builder-actions">
          <button id="builder-block-add" disabled>ブロック追加</button>
          <button id="builder-copy" disabled>COPY</button>
          <button id="builder-clear">CLEAR</button>
        </div>
      </div>

      <!-- 選択式 Prompt Builder -->
      <section id="select-builder" aria-labelledby="select-builder-title">
        <div id="select-builder-head">
          <div>
            <h2 id="select-builder-title">Selectable Builder</h2>
            <p id="select-builder-subtitle">SeaArt向けにブロックを選んで完成プロンプトを生成</p>
          </div>
          <div id="select-builder-actions">
            <button id="select-generate">Generate</button>
            <button id="select-copy-positive" disabled>Copy Positive</button>
            <button id="select-copy-negative" disabled>Copy Negative</button>
            <button id="select-clear">Clear</button>
          </div>
        </div>

        <div id="select-builder-controls">
          <label id="select-search-label" for="select-search">検索</label>
          <input id="select-search" type="search" placeholder="キャラ / ポーズ / 背景を検索..." autocomplete="off" />
          <div id="select-category-tabs" role="tablist" aria-label="Prompt block categories"></div>
        </div>

        <div id="select-builder-body">
          <div id="select-block-list" aria-live="polite"></div>
          <div id="selected-blocks-panel">
            <div class="select-panel-label">選択中</div>
            <div id="selected-blocks"></div>
          </div>
        </div>

        <div id="generated-prompts">
          <div class="prompt-output-group">
            <label for="positive-output">Positive Prompt</label>
            <textarea id="positive-output" readonly placeholder="GenerateするとここにPositive Promptが出ます"></textarea>
          </div>
          <div class="prompt-output-group">
            <label for="negative-output">Negative Prompt</label>
            <textarea id="negative-output" readonly placeholder="GenerateするとここにNegative Promptが出ます"></textarea>
          </div>
        </div>
      </section>

      <!-- レコード一覧 -->
      <div id="record-list"><!-- JS で生成 --></div>
      <div id="empty-msg" hidden>該当するタグがありません。</div>
    </main>

    <!-- 右サイドバー: インデックスパネル -->
    <aside id="index-panel">
      <div id="index-header">インデックス</div>
      <nav id="index-tree"><!-- JS で生成 --></nav>
    </aside>

  </div>

  <div id="toast"></div>

  <!-- コンテキストメニュー -->
  <div id="ctx-menu">
    <button id="ctx-delete">このタグを削除</button>
    <div class="ctx-sep"></div>
    <button id="ctx-copy">コピー</button>
    <button id="ctx-add">Builder に追加</button>
  </div>

  <!-- ブロック追加ダイアログ -->
  <div id="block-dialog">
    <div id="block-dialog-box">
      <div id="block-dialog-title">選択式ブロックを追加</div>
      <div class="block-field">
        <label class="block-lbl" for="block-name-input">ブロック名</label>
        <input id="block-name-input" class="block-inp" type="text" placeholder="例: やさしい笑顔" maxlength="40" autocomplete="off" />
      </div>
      <div class="block-field">
        <label class="block-lbl" for="block-category-select">カテゴリ</label>
        <select id="block-category-select" class="block-inp"></select>
      </div>
      <div class="block-field block-field-wide">
        <label class="block-lbl" for="block-positive-input">Positive</label>
        <textarea id="block-positive-input" class="block-textarea"></textarea>
      </div>
      <div class="block-field block-field-wide">
        <label class="block-lbl" for="block-negative-input">Negative</label>
        <textarea id="block-negative-input" class="block-textarea" placeholder="任意"></textarea>
      </div>
      <label id="block-favorite-row">
        <input id="block-favorite-input" type="checkbox" />
        よく使うブロックとして上位表示
      </label>
      <div id="block-error"></div>
      <div id="block-dialog-btns">
        <button id="block-confirm">追加</button>
        <button id="block-cancel">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- タグ追加ダイアログ -->
  <div id="tag-add-dialog">
    <div id="tag-add-box">
      <div id="tag-add-header">
        <span id="tag-add-title">タグを追加</span>
        <div id="tad-manage-btns">
          <button id="tad-export-btn" title="追加済みタグをエクスポート">エクスポート</button>
          <label id="tad-import-label" title="追加済みタグをインポート">インポート
            <input id="tad-import-input" type="file" accept=".json" />
          </label>
          <span id="tad-user-count"></span>
        </div>
      </div>
      <div class="tad-field">
        <label class="tad-lbl">EN <span class="tad-req">必須</span></label>
        <input id="tad-en" class="tad-inp" type="text" placeholder="english_tag" autocomplete="off" />
      </div>
      <div class="tad-field">
        <label class="tad-lbl">JP <span class="tad-req">必須</span></label>
        <input id="tad-jp" class="tad-inp" type="text" placeholder="日本語説明" autocomplete="off" />
      </div>
      <div class="tad-field">
        <label class="tad-lbl">カテゴリ</label>
        <select id="tad-cat" class="tad-sel"></select>
      </div>
      <div class="tad-field" id="tad-sc-row">
        <label class="tad-lbl">サブカテゴリ</label>
        <div class="tad-cascade-wrap">
          <select id="tad-sc" class="tad-sel"></select>
          <input id="tad-sc-new" class="tad-inp tad-new-inp" type="text" placeholder="新規サブカテゴリ名" autocomplete="off" />
        </div>
      </div>
      <div class="tad-field" id="tad-sec-row">
        <label class="tad-lbl">セクション</label>
        <div class="tad-cascade-wrap">
          <select id="tad-sec" class="tad-sel"></select>
          <input id="tad-sec-new" class="tad-inp tad-new-inp" type="text" placeholder="新規セクション名" autocomplete="off" />
        </div>
      </div>
      <div class="tad-field">
        <label class="tad-lbl">Target</label>
        <select id="tad-target" class="tad-sel">
          <option value="">未設定</option>
          <option value="self">self</option>
          <option value="other">other</option>
          <option value="mutual">mutual</option>
          <option value="object">object</option>
        </select>
      </div>
      <div class="tad-field">
        <label class="tad-lbl">Target Note</label>
        <input id="tad-tnote" class="tad-inp" type="text" placeholder="（任意）" autocomplete="off" />
      </div>
      <div id="tad-error"></div>
      <div id="tad-btns">
        <button id="tad-confirm">追加</button>
        <button id="tad-close">閉じる</button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=6b6c2a9"></script>
</body>
</html>
